services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: llm-gateway-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -e .
    startCommand: python scripts/seed.py && uvicorn gateway.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-gateway-db
          property: connectionString
      # DATABASE_SYNC_URL must match DATABASE_URL but with psycopg2 driver
      # Set this manually on Render dashboard after deploy
      - key: DATABASE_SYNC_URL
        sync: false
      # Get a free Redis at https://upstash.com → copy the Redis URL here
      - key: REDIS_URL
        sync: false
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: GATEWAY_SECRET_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: OTEL_ENABLED
        value: "false"
      - key: MOCK_LATENCY_MS
        value: "100"
      - key: MOCK_FAILURE_RATE
        value: "0.0"
      # Optional — add real provider keys to enable them
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── Frontend Static Site ─────────────────────────────────────────────────
  - type: web
    name: llm-gateway-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend URL after the API service is deployed
      # e.g. https://llm-gateway-api.onrender.com
      - key: VITE_API_URL
        sync: false
      - key: VITE_ADMIN_KEY
        sync: false

# ── PostgreSQL Database ──────────────────────────────────────────────────
databases:
  - name: llm-gateway-db
    databaseName: llm_gateway
    user: gateway
    plan: free
    region: oregon
